<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bujjima's Typing Fun</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="decor-layer">
    <span class="decor decor-1">☁️</span>
    <span class="decor decor-2">⭐</span>
    <span class="decor decor-3">☁️</span>
    <span class="decor decor-4">✨</span>
    <span class="decor decor-5">💖</span>
    <span class="decor decor-6">⭐</span>
  </div>
  <div id="confetti-layer"></div>
  <div id="critter-layer"></div>

  <header id="title-badge">🌈 Bujjima's Typing Fun 🌈</header>

  <div id="welcome">
    <div id="welcome-card">
      <div id="welcome-emoji">🌈</div>
      <h1>Bujjima's Typing Fun!</h1>
      <p>Press any key on the keyboard<br />(or tap the screen) to begin ✨</p>
      <div id="welcome-friends">🐶 🐱 🦁 🐰 🐘 🦋</div>
    </div>
  </div>

  <main id="display">
    <div id="card">
      <div id="emoji">⭐</div>
      <div id="word">Press a key!</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
